name: Görsel üret ve Buffer'a planla

on:
  schedule:
    # Günde 8 paylaşımda kuyruk ~1 günde tükeniyor; 3 saatte bir doldurmak
    # hem payı bırakıyor hem de bir tur atlansa boşluk oluşmuyor.
    - cron: "0 */3 * * *"    # her 3 saatte bir (UTC)
  workflow_dispatch:          # Actions sekmesinden elle de tetiklenebilir

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write             # üretilen görselleri ve state.json'ı commit'lemek için

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Çalıştır
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python -m generator.main run

      - name: Değişiklikleri commit'le
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "otomatik: yeni görseller ve zamanlama durumu"
            git push
          fi
