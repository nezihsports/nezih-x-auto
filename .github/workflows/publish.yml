name: Görsel üret ve Buffer'a planla

on:
  schedule:
    # Günde 8 paylaşımda kuyruk ~1 günde tükeniyor; 3 saatte bir doldurmak
    # hem payı bırakıyor hem de bir tur atlansa boşluk oluşmuyor.
    - cron: "0 */3 * * *"    # her 3 saatte bir (UTC)
  workflow_dispatch:          # Actions sekmesinden elle de tetiklenebilir

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write             # üretilen görselleri ve state.json'ı commit'lemek için

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Çalıştır
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python -m generator.main run

      - name: Değişiklikleri commit'le
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A: silinen görselleri de aşamaya alır (eski görsel temizliği için)
          git add -A docs state.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "otomatik: yeni görseller ve zamanlama durumu"
          # Bu arada başka bir commit geldiyse (elle düzenleme, başka bir tur)
          # düz push reddedilir ve tur boşa gider. Rebase edip tekrar deniyoruz.
          for i in 1 2 3; do
            if git push; then
              echo "Push başarılı (deneme $i)."
              exit 0
            fi
            echo "Push reddedildi, rebase edilip tekrar denenecek ($i/3)..."
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "Push 3 denemede de başarısız oldu." >&2
          exit 1
