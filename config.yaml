# GitHub Pages kokunuz. Repo ayarlarindan Pages'i "main / docs" olarak acinca
# bu adres olusur. Sonuna / koymayin.
pages_base_url: "https://nezihsports.github.io/nezih-x-auto"

# Yayinlanmis postlarin gorselleri kac gun sonra silinsin. Bekleyen bir postun
# gorseli asla silinmez. 0 = hic silme (depo suresiz buyur).
keep_asset_days: 21

channels:
  # ── 1) Spor haberleri ───────────────────────────────────────────────
  - name: nezihsport
    enabled: true
    buffer_channel_id: "6a97ff58065799be467283c1"
    source: rss
    rss_url: "https://www.ntvspor.net/rss/anasayfa"
    # raw : kaynagin gorseli OLDUGU GIBI, uzerine baslik yazilmaz, alta markali
    #       serit eklenir. NTV'nin gorselleri zaten kendi basligi basilmis
    #       kartlar oldugu icin dogru secim bu.
    # news: fotograf uzerine kendi basligimiz (temiz fotografli beslemeler icin)
    # text: fotografsiz, tamamen kendi kartimiz
    template: raw
    default_label: "Spor"
    fetch_og_image: true
    bg_blur: 14                  # sadece template: news icin gecerli

    # Kaynak atfi - hem gorselin alt seridinde hem post metninde gorunur.
    # Kapatmak icin show_source: false
    show_source: true
    source_label: "NTV"

    # Marka logosunda "bet" gectigi icin spor/sosyal hesaplarda KAPALI.
    # "brand" yaparsan assets/logo.png basilir. Logo yerine notr bir metin
    # isareti birakmak icin watermark_text kullan (bos birakirsan hicbir sey).
    logo: "none"
    watermark_text: "NEZİH SPOR"

    # Zamanlama (Turkiye saati) - gunde 8 paylasim, 09:00-23:00 arasi iki saatte bir.
    # Aylik ~240 post; Buffer'in X hesabi basina 500/ay tavaninin altinda kaliyor.
    slots: ["09:00", "11:00", "13:00", "15:00", "17:00", "19:00", "21:00", "23:00"]
    min_gap_hours: 1.5           # slot araligi 2 saat; bunun altinda kalmali
    min_lead_minutes: 90         # gorselin Pages'e yayilmasi icin pay
    queue_target: 9              # Buffer ucretsiz sinir 10; 1 tampon

    # Metin
    include_summary: true
    include_link: true           # Buffer uzerinden gittigi icin link EK MALIYET DEGIL
    signature: "-Nezih Spor"
    max_chars: 275

    # ── Hashtag ──────────────────────────────────────────────────────
    # Haberin KENDI iceriginden turetilir. Gundem/trend hashtag'i eklemek
    # X'in Platform Manipulation kuralina giriyor ve 3+ hashtag spam
    # siniflandiricisini tetikliyor - bu yuzden ust sinir 2.
    # Kurallar SIRALI degerlendirilir, ilk eslesenler kazanir.
    max_hashtags: 2
    hashtags: "#SüperLig"        # hicbir kural tutmazsa kullanilir
    hashtag_rules:
      # Kulupler (en spesifik, once bunlar)
      # NOT: "aslan" ve "kartal" gibi lakaplar kural olarak KULLANILMAZ -
      # ikisi de yaygin soyadi, alakasiz haberlere yanlis etiket yapistirir.
      - tag: "#Galatasaray"
        match: ["galatasaray", "cimbom", "cim bom"]
      - tag: "#Fenerbahçe"
        match: ["fenerbahçe", "fenerbahce"]
      - tag: "#Beşiktaş"
        match: ["beşiktaş", "besiktas"]
      - tag: "#Trabzonspor"
        match: ["trabzonspor", "bordo mavi"]
      - tag: "#Başakşehir"
        match: ["başakşehir", "basaksehir"]
      - tag: "#Samsunspor"
        match: ["samsunspor"]
      # Turnuvalar
      - tag: "#ŞampiyonlarLigi"
        match: ["şampiyonlar ligi", "sampiyonlar ligi", "devler ligi"]
      - tag: "#AvrupaLigi"
        match: ["avrupa ligi", "uefa avrupa"]
      - tag: "#KonferansLigi"
        match: ["konferans ligi"]
      - tag: "#MilliTakım"
        match: ["milli takım", "millî takım", "a milli", "ay-yıldızlı"]
      # Konu
      - tag: "#Transfer"
        match: ["transfer", "bonservis", "imza", "sözleşme"]
      - tag: "#Basketbol"
        match: ["basketbol", "12 dev adam", "euroleague"]
      - tag: "#Voleybol"
        match: ["voleybol", "filenin sultanları"]
      - tag: "#SüperLig"
        match: ["süper lig", "super lig"]

  # ── 2) Sosyal / etkilesim ───────────────────────────────────────────
  - name: nezihsosyal
    enabled: false               # ikinci hesabi baglayinca true yapin
    buffer_channel_id: ""
    source: pool                 # haber beslemesi yok; sabit havuzdan siralar
    template: text               # duz markali gradient kart
    default_label: ""
    logo: "none"                 # sosyal hesapta marka isareti yok
    watermark_text: ""
    slots: ["13:00", "21:00"]
    min_gap_hours: 8
    queue_target: 8
    include_link: false
    hashtags: ""
    signature: ""
    pool:
      - title: "Bu hafta en çok hangi maçı bekliyorsun?"
        summary: "Yorumlarda yaz, en çok oy alanı canlı takip edelim."
        label: "Anket"
      - title: "Derbi günü geldi"
        summary: "Tahminini paylaş, hafta sonu kim kazanacak?"
        label: "Tahmin"
      # ... buraya istediğiniz kadar giriş ekleyin; sırayla paylaşılır

  # ── 3) Marka hesabı ─────────────────────────────────────────────────
  - name: nezihbet
    enabled: false               # icerigi netlesince true yapin
    buffer_channel_id: ""
    source: pool
    template: text
    logo: "brand"                # marka hesabi - logo burada anlamli
    slots: ["12:00"]
    min_gap_hours: 24
    queue_target: 6
    include_link: false
    signature: ""
    pool: []
